services:
  weather-api:
    build:
      context: .
      dockerfile: src/Weather.Api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  weather-job:
    build:
      context: .
      dockerfile: src/Weather.Job/Dockerfile
    env_file:
      - .env
    environment:
      - WeatherApi__ScheduledUrl=http://weather-api:8080/api/weather/scheduled
    depends_on:
      - weather-api
    profiles:
      - job
