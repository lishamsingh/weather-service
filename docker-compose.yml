services:
  weather-api:
    build:
      context: .
      dockerfile: src/Weather.Api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  weather-job:
    build:
      context: .
      dockerfile: src/Weather.Job/Dockerfile
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Development
      WeatherApi__ScheduledUrl: http://weather-api:8080/api/weather/scheduled
    depends_on:
      weather-api:
        condition: service_healthy
    profiles:
      - job
