name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WeatherService.slnx

      - name: Build
        run: dotnet build WeatherService.slnx --no-restore

#      - name: Test
#        run: |
#          dotnet test tests/Weather.Api.Tests --no-build --verbosity normal
#          dotnet test tests/Weather.Job.Tests --no-build --verbosity normal
