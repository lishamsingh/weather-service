name: CD

on:
  push:
    branches: [main, master]

jobs:
  # ── 1. Build & push images to ghcr.io ──────────────────────────────────────
  push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # needed to push to ghcr.io

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push weather-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Weather.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/weather-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/weather-api:latest

      - name: Build and push weather-job
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Weather.Job/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/weather-job:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/weather-job:latest

  # ── 2. Deploy to Azure Container Apps ──────────────────────────────────────
  # Activated in Phase 9 once Azure resources and OIDC are configured.
  deploy:
    needs: push-images
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # needed for OIDC login to Azure
      contents: read

    environment: production

    env:
      RESOURCE_GROUP: rg-weather-service
      API_APP_NAME: ca-weather-api
      JOB_NAME: caj-weather-daily
      IMAGE_TAG: ${{ needs.push-images.outputs.image-tag }}

    steps:
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name $API_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image ghcr.io/${{ github.repository_owner }}/weather-api:$IMAGE_TAG

      - name: Update Container Apps Job image
        run: |
          az containerapp job update \
            --name $JOB_NAME \
            --resource-group $RESOURCE_GROUP \
            --image ghcr.io/${{ github.repository_owner }}/weather-job:$IMAGE_TAG
